<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Adivinhe o Número</h1>
    <p>Escolha um número entre <strong>1 e 100</strong>. Consegue adivinhar?</p>

    <input type="number" id="palpite" placeholder="Digite seu palpite" min="1" max="100">
    <button id="btnAcao">CHUTAR</button>

    <div class="message" id="mensagem"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
